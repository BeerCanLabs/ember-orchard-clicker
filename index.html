<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Booth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-aurora" aria-hidden="true"></div>

    <div class="level-badge" id="level-badge" aria-label="Player level">
      <svg class="level-ring" viewBox="0 0 76 76" aria-hidden="true">
        <circle class="level-ring-track" cx="38" cy="38" r="32"></circle>
        <circle class="level-ring-fill" id="level-ring-fill" cx="38" cy="38" r="32"></circle>
      </svg>
      <div class="level-badge-core">
        <span class="level-kicker">LVL</span>
        <span class="level-value" id="level-value">1</span>
      </div>
      <div class="level-exp-tip" id="level-exp-tip">0 / 12 XP</div>
    </div>

    <main class="game-shell">
      <header>
        <p class="eyebrow">A tiny incremental game</p>
        <h1>Ticket Booth</h1>
        <button id="reset-button" class="reset-button" title="Start over">Reset progress</button>
      </header>

      <section class="stats-board" aria-label="Game statistics">
        <article class="stat-card stat-tickets">
          <div class="stat-icon" aria-hidden="true">🎟</div>
          <div class="stat-copy">
            <span class="stat-label">Tickets</span>
            <span class="stat-value" id="embers">0</span>
          </div>
        </article>
        <article class="stat-card stat-rate">
          <div class="stat-icon" aria-hidden="true">⏱</div>
          <div class="stat-copy">
            <span class="stat-label">Per second</span>
            <span class="stat-value" id="per-second">0</span>
          </div>
        </article>
        <article class="stat-card stat-click">
          <div class="stat-icon" aria-hidden="true">👆</div>
          <div class="stat-copy">
            <span class="stat-label">Per claim</span>
            <span class="stat-value" id="per-click">1</span>
          </div>
        </article>
        <article class="stat-card stat-xp">
          <div class="stat-icon" aria-hidden="true">✦</div>
          <div class="stat-copy">
            <span class="stat-label">XP to next</span>
            <span class="stat-value" id="xp-to-next">12</span>
          </div>
        </article>
      </section>

      <section class="play-area">
        <div class="orchard-wrap">
          <button id="orchard-button" class="claim-pad" aria-label="Claim a ticket">
            <span class="claim-glow" aria-hidden="true"></span>
            <span class="claim-ticket" aria-hidden="true">
              <span class="claim-ticket-notch claim-ticket-notch-left"></span>
              <span class="claim-ticket-notch claim-ticket-notch-right"></span>
              <span class="claim-ticket-stub">ADMIT</span>
              <span class="claim-ticket-main">
                <span class="claim-ticket-mark">🎟</span>
                <span class="claim-ticket-title">TICKET</span>
                <span class="claim-ticket-sub">PRESS TO CLAIM</span>
              </span>
            </span>
            <span class="claim-label">claim +1 XP</span>
          </button>
          <p class="hint">Every stub counts toward the show.</p>
        </div>

        <aside class="shop" aria-label="Upgrade shop">
          <div class="shop-title">
            <div class="shop-title-main">
              <span class="shop-kicker">Box office</span>
              <span class="shop-heading">Ticket Shop</span>
            </div>
            <span class="shop-owned" id="owned-count">0 owned</span>
          </div>
          <div class="shop-columns" aria-hidden="true">
            <span>Item</span>
            <span>Price</span>
          </div>
          <div id="upgrades" class="upgrades"></div>
        </aside>
      </section>
      <p id="status" class="status" aria-live="polite">The booth is quiet. For now.</p>
    </main>
    <script src="game-core.js"></script>
    <script src="app.js"></script>
  </body>
</html>
